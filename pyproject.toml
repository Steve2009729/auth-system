[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "authsystem-fastapi"
version = "1.0.0"
description = "Self-hosted FastAPI auth & authorization backend — JWT, RBAC, 2FA, OAuth2, audit logging, ready to run"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
    { name = "AuthSystem Contributors" },
]
keywords = [
    "fastapi", "authentication", "authorization", "jwt", "rbac",
    "oauth2", "2fa", "totp", "postgresql", "redis", "self-hosted",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Session",
    "Topic :: Security",
]

dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.30.1",
    "sqlalchemy[asyncio]==2.0.30",
    "asyncpg==0.29.0",
    "alembic==1.13.1",
    "redis[asyncio]==5.0.4",
    "pydantic[email]==2.7.1",
    "pydantic-settings==2.3.1",
    "pyjwt==2.8.0",
    "bcrypt==4.1.3",
    "pyotp==2.9.0",
    "qrcode[pil]==7.4.2",
    "authlib==1.3.1",
    "httpx==0.27.0",
    "aiosmtplib==3.0.1",
    "python-multipart==0.0.9",
    "python-dotenv==1.0.1",
    "typer[all]==0.12.3",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.2",
    "pytest-asyncio==0.23.7",
    "aiosqlite==0.19.0",
    "ruff==0.4.8",
    "pytest-cov==5.0.0",
]

[project.scripts]
authsystem = "authsystem.cli:app"

[project.urls]
Homepage = "https://github.com/Steve2009729/auth-system"
Repository = "https://github.com/Steve2009729/auth-system"
Issues = "https://github.com/Steve2009729/auth-system/issues"

[tool.hatch.build.targets.wheel]
packages = ["app", "authsystem"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "W", "I"]
ignore = ["E501"]
